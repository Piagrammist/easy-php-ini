name: CI

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/CI.yml"
      - composer.json
      - composer.lock
      - phpunit.xml
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/CI.yml"
      - composer.json
      - composer.lock
      - phpunit.xml

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Validate Composer Files
        run: composer validate --strict

      - name: Cache Composer Packages
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install Dependencies
        run: composer install --no-progress

      - name: Run Test Suite
        run: composer test
